<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eine wichtige Frage 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ff9ecb, #ffd6e7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #333;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    /* FRAGE */

    .buttons {
      position: relative;
      height: 150px;
      margin-top: 25px;
    }

    #yes,
    #no {
      position: absolute;
      top: 20px;
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #yes {
      left: 35%;
      background: #ff4d8d;
      color: white;
    }

    #no {
      left: 55%;
      background: #eee;
      color: #333;
    }

    /* DATE-AUSWAHL */

    .date-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 25px;
    }

    .date-option {
      background: #fff0f6;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 18px 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .date-option.selected {
      border-color: #ff4d8d;
      background: #ffdce9;
    }

    .date-emoji {
      display: block;
      font-size: 30px;
      margin-bottom: 8px;
    }

    /* DATUM */

    .when-section {
      margin-top: 30px;
      text-align: left;
    }

    .when-section label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    #submitBtn {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: #ff4d8d;
      color: white;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #submitBtn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .back-btn {
      border: none;
      background: transparent;
      color: #888;
      margin-top: 15px;
      cursor: pointer;
    }

    .summary {
      background: #fff0f6;
      padding: 18px;
      border-radius: 16px;
      margin: 25px 0;
      line-height: 1.8;
    }

    #retryBtn {
      border: none;
      border-radius: 999px;
      background: #ff4d8d;
      color: white;
      padding: 14px 24px;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 26px;
      }

      .date-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="card">

  <!-- FRAGE -->

  <div id="questionPage">

    <h1>Kurze Frage 💖</h1>

    <p>
      Hast du Lust auf ein Date mit mir? 🥰
    </p>

    <div class="buttons">

      <button id="yes" type="button">
        Ja 💘
      </button>

      <button id="no" type="button">
        Nein
      </button>

    </div>

  </div>


  <!-- DATE AUSWÄHLEN -->

  <div id="datePage" class="hidden">

    <h1>Yaaay! 🥰</h1>

    <p>
      Dann müssen wir nur noch entscheiden,
      was wir machen. 💕
    </p>

    <p style="font-size:16px;">
      Worauf hast du Lust?
    </p>

    <div class="date-options">

      <button class="date-option" type="button" data-date="Essen gehen">
        <span class="date-emoji">🍝</span>
        Essen gehen
      </button>

      <button class="date-option" type="button" data-date="Kino">
        <span class="date-emoji">🎬</span>
        Kino
      </button>

      <button class="date-option" type="button" data-date="Drinks & Bar">
        <span class="date-emoji">🍸</span>
        Drinks & Bar
      </button>

      <button class="date-option" type="button" data-date="Matcha + Spaziergang">
        <span class="date-emoji">🍵</span>
        Matcha + Spaziergang
      </button>

      <button class="date-option" type="button" data-date="Minigolf">
        <span class="date-emoji">⛳</span>
        Minigolf
      </button>

    </div>


    <div class="when-section">

      <label for="date">
        📅 Wann kannst du?
      </label>

      <input type="date" id="date">

      <label for="time">
        🕐 Um wie viel Uhr?
      </label>

      <input type="time" id="time">

    </div>
