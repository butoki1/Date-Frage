    body {

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #333;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 500px;
      width: 100%;

    h1 {

      margin-bottom: 10px;
      font-size: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    /* JA / NEIN */

    .buttons {
      position: relative;
      height: 140px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }

    button:hover {
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    #yes {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(-120%);
      background: #ff4d8d;
      color: white;
      padding: 14px 24px;
    }

    #no {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(20%);
      background: #eee;
      color: #333;
      padding: 14px 24px;
    }

    /* DATE AUSWAHL */

    .date-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 25px;
    }

    .date-option {
      background: #fff0f6;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 18px 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .date-option:hover {
      background: #ffe0ed;
      transform: translateY(-2px);
    }

    .date-option.selected {
      border-color: #ff4d8d;
      background: #ffdce9;
      box-shadow: 0 5px 15px rgba(255,77,141,0.2);
    }

    .date-emoji {
      display: block;
      font-size: 30px;
      margin-bottom: 8px;
    }

    /* DATUM / UHRZEIT */

    .when-section {
      margin-top: 30px;
      text-align: left;
    }

    .when-section label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 18px;
    }

    /* ABSENDEN */

    #submitBtn {
      width: 100%;
      background: #ff4d8d;
      color: white;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #submitBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .back-btn {
      background: transparent;
      color: #888;
      font-size: 14px;
      margin-top: 15px;
      padding: 8px;
    }

    /* ERFOLG */

    .heart {
      font-size: 55px;
      animation: pulse 1s infinite;
    }

    .summary {
      background: #fff0f6;
      padding: 18px;
      border-radius: 16px;
      margin: 25px 0;
      font-size: 16px;
      line-height: 1.8;
    }

    .result {
      font-size: 22px;
      font-weight: bold;
    }
